<!-- Simulador de galaxias — pegar en un Bloque de código (modo HTML) de Squarespace -->
<iframe id="simulador-galaxias"
        src="https://vantoniacf-pixel.github.io/galaxy-simulator/"
        title="Simulador de galaxias"
        style="width:100%; height:1400px; border:0; display:block"
        allow="fullscreen"
        loading="lazy"></iframe>
<script>
  // ajusta la altura del iframe al contenido del simulador (sin barra de desplazamiento interna)
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "simulador-galaxias:height") {
      document.getElementById("simulador-galaxias").style.height = e.data.height + "px";
    }
  });
</script>
